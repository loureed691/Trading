# KuCoin Trading Bot Configuration Example
# Copy this file to config.yaml and fill in your settings

# API credentials (use environment variables or secrets.yaml for production)
api:
  key: "${KUCOIN_API_KEY}"
  secret: "${KUCOIN_API_SECRET}"
  passphrase: "${KUCOIN_API_PASSPHRASE}"
  sandbox: true  # Use sandbox for testing

# Trading modes
trading:
  mode: "paper"  # paper, live
  markets:
    - spot
    - margin
    - futures

# Pair selection criteria
pair_selection:
  min_volume_24h: 1000000  # USD
  max_spread_pct: 0.5  # percent
  min_volatility: 0.02
  max_volatility: 0.15
  max_funding_rate: 0.001  # for futures
  max_fee_pct: 0.1
  auto_market_selection: true  # Enable automatic spot/margin/futures selection
  # Slippage filtering (new)
  max_slippage_pct: 0.5  # Maximum acceptable slippage percentage
  min_liquidity_depth: 10000  # Minimum orderbook depth in USD
  order_size_for_slippage: 10000  # Order size in USD for slippage estimation
  weights:
    volume: 0.15
    spread: 0.20
    volatility: 0.20
    funding: 0.10
    fee: 0.15
    slippage: 0.20

# Regime detection settings
regime:
  trend_threshold: 0.3
  volatility_lookback: 20
  trend_lookback: 50
  hurst_lookback: 100
  volatility_high_pct: 80
  volatility_low_pct: 20

# ML settings (forecasting and position sizing)
ml:
  lookback: 100
  forecast_horizon: 5
  min_cv_score: 0.51  # Minimum CV score for reliable forecasts
  n_cv_folds: 5
  min_training_samples: 200
  target_volatility: 0.10
  kelly_fraction: 0.25  # Fractional Kelly for position sizing

# Risk management
risk:
  max_position_pct: 5.0  # max % of portfolio per position (auto-adjusted)
  max_drawdown_pct: 10.0  # max portfolio drawdown (auto-adjusted)
  atr_multiplier: 2.0  # for stop loss
  var_confidence: 0.95  # Value at Risk confidence level
  margin_buffer: 0.2  # 20% margin buffer
  max_leverage: 5  # max leverage for futures/margin (auto-adjusted)
  daily_loss_limit_pct: 3.0
  # Portfolio-level risk controls (new)
  portfolio_stop_loss_pct: 15.0  # Close all positions if total loss exceeds this
  portfolio_take_profit_pct: 50.0  # Optional take-profit at portfolio level
  trailing_stop_pct: 10.0  # Trailing stop from peak portfolio value
  safe_mode_reduction_factor: 0.5  # Reduce position sizes by this factor in safe mode

# Strategy settings
strategies:
  use_ensemble: true  # Enable ensemble strategy with regime-based allocation
  
  ensemble:
    min_agreement: 0.5  # Minimum strategy agreement for signal
    strength_threshold: 0.3
  
  enabled:
    - trend
    - mean_reversion
    - breakout
    - market_making
    - momentum
  
  trend:
    short_period: 20
    long_period: 50
    signal_threshold: 0.02
  
  mean_reversion:
    lookback: 20
    entry_zscore: 2.0
    exit_zscore: 0.5
  
  breakout:
    lookback: 20
    volume_multiplier: 1.5
    atr_multiplier: 1.0
  
  market_making:
    spread_multiplier: 1.5
    inventory_target: 0.5
    max_inventory_pct: 30
  
  momentum:
    roc_period: 10
    rsi_period: 14
    volume_period: 10
    momentum_threshold: 0.02
    rsi_overbought: 70
    rsi_oversold: 30
    atr_multiplier: 2.0

# Backtesting
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 10000
  walk_forward_periods: 5
  train_pct: 0.7

# Logging
logging:
  level: INFO
  file: "logs/bot.log"
  max_size_mb: 10
  backup_count: 5
  audit_dir: "logs/audit"  # Audit log directory

# Retry settings
retry:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  exponential_base: 2.0
